name: SEO Agent (weekly)

on:
  schedule:
    # Every Sunday at 09:00 UTC (= 11:00 Israel time)
    - cron: "0 9 * * 0"
  workflow_dispatch:
    # Allow manual trigger from GitHub UI for testing

jobs:
  seo-agent:
    name: Run SEO Agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/seo-agent/package.json

      - name: Install agent dependencies
        run: npm install
        working-directory: scripts/seo-agent

      - name: Run SEO agent
        run: node index.js
        working-directory: scripts/seo-agent
        env:
          # GitHub (automatically provided)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

          # Firebase (add these secrets in GitHub → Settings → Secrets)
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

          # Google APIs (Search Console + GA4)
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # GA4_PROPERTY_ID must be the NUMERIC property ID (e.g. "123456789")
          # NOT the measurement ID (G-XXXXXXXXXX).
          # Find it: Google Analytics → Admin → Property Settings → Property ID
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}

          # Claude AI
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # PageSpeed Insights (optional — free Google API key)
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}

          # Email
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
