<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#grad)"/>
  <defs>
    <radialGradient id="grad" cx="30%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Grid lines -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#1e1e1e" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#1e1e1e" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="#1e1e1e" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="#1e1e1e" stroke-width="1"/>
  <!-- Phone frames for Shorts -->
  <rect x="120" y="140" width="120" height="210" rx="12" fill="none" stroke="#c8a96e" stroke-width="2" opacity="0.8"/>
  <rect x="270" y="170" width="120" height="210" rx="12" fill="none" stroke="#c8a96e" stroke-width="1.5" opacity="0.5"/>
  <rect x="420" y="155" width="120" height="210" rx="12" fill="none" stroke="#c8a96e" stroke-width="1" opacity="0.3"/>
  <!-- ROI arrow -->
  <path d="M 700 380 L 900 200" stroke="#c8a96e" stroke-width="3" stroke-dasharray="8,4" opacity="0.6"/>
  <polygon points="900,200 880,220 920,220" fill="#c8a96e" opacity="0.6" transform="rotate(-45 900 200)"/>
  <!-- Text -->
