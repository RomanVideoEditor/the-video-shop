<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#080c08"/>
  <defs>
    <radialGradient id="g1" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1a3a1e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#080c08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#080c08" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Left speaker: Doctor -->
  <rect x="60" y="180" width="260" height="195" rx="8" fill="#0e140e" stroke="#2a4a2e" stroke-width="1.5" opacity="0.85"/>
  <!-- Person silhouette -->
  <circle cx="190" cy="245" r="32" fill="#1a2a1a" stroke="#3a6a3e" stroke-width="1" opacity="0.7"/>
  <rect x="150" y="275" width="80" height="65" rx="20" fill="#1a2a1a" stroke="#3a6a3e" stroke-width="1" opacity="0.6"/>
  <!-- Label below speaker -->
  <rect x="95" y="345" width="190" height="22" rx="4" fill="#c8a96e" opacity="0.12"/>
  <text x="190" y="361" font-family="sans-serif" font-size="10" fill="#c8a96e" text-anchor="middle" opacity="0.8">רופאה · קהילת HealthTech</text>

  <!-- Connecting handwritten bridge -->
  <path d="M 325 278 Q 400 250 470 278" fill="none" stroke="#c8a96e" stroke-width="1.5" stroke-dasharray="3,5" opacity="0.5"/>
  <!-- Handwritten-style text label -->
  <text x="396" y="243" font-family="Georgia, serif" font-size="13" fill="#c8a96e" text-anchor="middle" opacity="0.65" transform="rotate(-5 396 243)">connects...</text>

  <!-- Center speaker: Entrepreneur -->
  <rect x="470" y="155" width="260" height="220" rx="8" fill="#0e140e" stroke="#c8a96e" stroke-width="2" opacity="0.9"/>
  <circle cx="600" cy="230" r="36" fill="#1e2818" stroke="#c8a96e" stroke-width="1.5" opacity="0.8"/>
  <rect x="556" y="264" width="88" height="70" rx="20" fill="#1e2818" stroke="#c8a96e" stroke-width="1" opacity="0.7"/>
  <rect x="490" y="350" width="220" height="22" rx="4" fill="#c8a96e" opacity="0.18"/>
  <text x="600" y="366" font-family="sans-serif" font-size="10" fill="#c8a96e" text-anchor="middle" opacity="0.9">יזם טכנולוגי · Nucleai</text>

  <!-- Connecting bridge right -->
  <path d="M 735 278 Q 810 248 878 278" fill="none" stroke="#c8a96e" stroke-width="1.5" stroke-dasharray="3,5" opacity="0.4"/>
  <text x="806" y="243" font-family="Georgia, serif" font-size="13" fill="#c8a96e" text-anchor="middle" opacity="0.5" transform="rotate(4 806 243)">leads to...</text>

  <!-- Right speaker: Program manager -->
  <rect x="880" y="180" width="260" height="195" rx="8" fill="#0e140e" stroke="#2a4a2e" stroke-width="1.5" opacity="0.8"/>
  <circle cx="1010" cy="245" r="32" fill="#1a2a1a" stroke="#3a6a3e" stroke-width="1" opacity="0.65"/>
  <rect x="970" y="275" width="80" height="65" rx="20" fill="#1a2a1a" stroke="#3a6a3e" stroke-width="1" opacity="0.55"/>
  <rect x="905" y="345" width="190" height="22" rx="4" fill="#c8a96e" opacity="0.1"/>
  <text x="1010" y="361" font-family="sans-serif" font-size="10" fill="#c8a96e" text-anchor="middle" opacity="0.7">מנהל תוכנית · קהילה</text>

  <!-- Impact numbers bottom center -->
  <rect x="350" y="420" width="500" height="80" rx="8" fill="#0e140e" stroke="#2a4a2e" stroke-width="1" opacity="0.8"/>
  <text x="435" y="455" font-family="sans-serif" font-size="11" fill="#c8a96e" text-anchor="middle" opacity="0.7" letter-spacing="1">11</text>
  <text x="435" y="476" font-family="sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle">בתי חולים</text>
  <line x1="490" y1="430" x2="490" y2="490" stroke="#2a4a2e" stroke-width="1" opacity="0.4"/>
  <text x="600" y="455" font-family="sans-serif" font-size="11" fill="#c8a96e" text-anchor="middle" opacity="0.7" letter-spacing="1">20+</text>
  <text x="600" y="476" font-family="sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle">מוסדות רפואיים</text>
  <line x1="710" y1="430" x2="710" y2="490" stroke="#2a4a2e" stroke-width="1" opacity="0.4"/>
  <text x="765" y="455" font-family="sans-serif" font-size="11" fill="#c8a96e" text-anchor="middle" opacity="0.6" letter-spacing="1">1×</text>
  <text x="765" y="476" font-family="sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle">יום צילום → סרט מלא</text>

  <!-- Labels -->
  <text x="600" y="555" font-family="sans-serif" font-size="15" fill="#c8a96e" text-anchor="middle" opacity="0.7" letter-spacing="4">EVENT RECAP · COMMUNITY IMPACT</text>
  <text x="600" y="590" font-family="sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle" letter-spacing="2">THE VIDEO SHOP</text>
</svg>
