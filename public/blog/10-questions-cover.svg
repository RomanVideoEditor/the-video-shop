<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g1)"/>

  <!-- Question cards -->
  <rect x="80" y="120" width="200" height="60" rx="6" fill="#111" stroke="#c8a96e" stroke-width="1.5" opacity="0.9"/>
  <text x="180" y="155" font-family="sans-serif" font-size="13" fill="#c8a96e" text-anchor="middle" opacity="0.9">Q1 — מי אתם?</text>

  <rect x="80" y="198" width="200" height="60" rx="6" fill="#111" stroke="#1e1e1e" stroke-width="1" opacity="0.7"/>
  <text x="180" y="233" font-family="sans-serif" font-size="13" fill="#f5f5f0" text-anchor="middle" opacity="0.6">Q2 — מה הייחוד?</text>

  <rect x="80" y="276" width="200" height="60" rx="6" fill="#111" stroke="#1e1e1e" stroke-width="1" opacity="0.6"/>
  <text x="180" y="311" font-family="sans-serif" font-size="13" fill="#f5f5f0" text-anchor="middle" opacity="0.5">Q3 — למי זה מתאים?</text>

  <rect x="80" y="354" width="200" height="60" rx="6" fill="#111" stroke="#1e1e1e" stroke-width="1" opacity="0.5"/>
  <text x="180" y="389" font-family="sans-serif" font-size="13" fill="#f5f5f0" text-anchor="middle" opacity="0.4">Q4 — מה התוצאה?</text>

  <rect x="80" y="432" width="200" height="60" rx="6" fill="#111" stroke="#1e1e1e" stroke-width="1" opacity="0.3"/>
  <text x="180" y="467" font-family="sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">Q5–Q10 ···</text>

  <!-- Arrow right -->
  <path d="M296 315 L420 315" stroke="#c8a96e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <polygon points="420,307 440,315 420,323" fill="#c8a96e" opacity="0.4"/>

  <!-- Camera / screen -->
  <rect x="450" y="180" width="340" height="270" rx="12" fill="#111" stroke="#c8a96e" stroke-width="1.5" opacity="0.7"/>
  <circle cx="620" cy="220" r="18" fill="#1a1a1a" stroke="#c8a96e" stroke-width="1" opacity="0.5"/>
  <circle cx="620" cy="220" r="8" fill="#c8a96e" opacity="0.4"/>
  <!-- Person silhouette -->
  <circle cx="620" cy="305" r="35" fill="#1e1e1e"/>
  <rect x="570" y="338" width="100" height="80" rx="20" fill="#1e1e1e"/>
  <!-- Mic icon -->
  <rect x="604" y="362" width="32" height="20" rx="10" fill="#2a2a2a" stroke="#c8a96e" stroke-width="1" opacity="0.6"/>

  <!-- Arrow right 2 -->
  <path d="M800 315 L900 315" stroke="#c8a96e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <polygon points="900,307 920,315 900,323" fill="#c8a96e" opacity="0.4"/>

  <!-- Output: multiple small screens -->
  <rect x="930" y="150" width="100" height="56" rx="6" fill="#111" stroke="#c8a96e" stroke-width="1" opacity="0.8"/>
  <text x="980" y="183" font-family="sans-serif" font-size="10" fill="#c8a96e" text-anchor="middle" opacity="0.7">Hero Video</text>

  <rect x="1050" y="150" width="100" height="56" rx="6" fill="#111" stroke="#1e1e1e" stroke-width="1" opacity="0.7"/>
  <text x="1100" y="183" font-family="sans-serif" font-size="10" fill="#f5f5f0" text-anchor="middle" opacity="0.6">×10 Shorts</text>

  <rect x="930" y="228" width="100" height="56" rx="6" fill="#111" stroke="#1e1e1e" stroke-width="1" opacity="0.6"/>
  <text x="980" y="261" font-family="sans-serif" font-size="10" fill="#f5f5f0" text-anchor="middle" opacity="0.5">LinkedIn</text>

  <rect x="1050" y="228" width="100" height="56" rx="6" fill="#111" stroke="#1e1e1e" stroke-width="1" opacity="0.5"/>
  <text x="1100" y="261" font-family="sans-serif" font-size="10" fill="#f5f5f0" text-anchor="middle" opacity="0.4">Stories</text>

  <rect x="930" y="306" width="100" height="56" rx="6" fill="#111" stroke="#1e1e1e" stroke-width="1" opacity="0.4"/>
  <text x="980" y="339" font-family="sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle">FAQ Page</text>

  <rect x="1050" y="306" width="100" height="56" rx="6" fill="#111" stroke="#1e1e1e" stroke-width="1" opacity="0.3"/>
  <text x="1100" y="339" font-family="sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle">Ads</text>

  <!-- Big 10 -->
  <text x="620" y="510" font-family="sans-serif" font-size="110" font-weight="900" fill="#f5f5f0" text-anchor="middle" opacity="0.04">10</text>

  <!-- Labels -->
  <text x="600" y="555" font-family="sans-serif" font-size="15" fill="#c8a96e" text-anchor="middle" opacity="0.7" letter-spacing="4">10 QUESTIONS FORMAT</text>
  <text x="600" y="588" font-family="sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle" letter-spacing="2">THE VIDEO SHOP</text>
</svg>
