<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#08080f"/>
  <defs>
    <radialGradient id="g1" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1a1a4e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#08080f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="75%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#08080f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Journey track line -->
  <line x1="100" y1="315" x2="1100" y2="315" stroke="#2a2a4e" stroke-width="2" opacity="0.5"/>

  <!-- Stage 1: Awareness -->
  <circle cx="220" cy="315" r="48" fill="#111" stroke="#c8a96e" stroke-width="1.5" opacity="0.5"/>
  <text x="220" y="296" font-family="sans-serif" font-size="9" fill="#c8a96e" text-anchor="middle" letter-spacing="2" opacity="0.7">STAGE 1</text>
  <text x="220" y="316" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c8a96e" text-anchor="middle" opacity="0.75">AWARENESS</text>
  <text x="220" y="334" font-family="sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle">Brand Film</text>
  <!-- Label below -->
  <text x="220" y="385" font-family="sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" opacity="0.6">מי אנחנו?</text>

  <!-- Arrow 1→2 -->
  <path d="M272 315 L348 315" stroke="#c8a96e" stroke-width="1" stroke-dasharray="5,4" opacity="0.3"/>
  <polygon points="348,309 364,315 348,321" fill="#c8a96e" opacity="0.3"/>

  <!-- Stage 2: Consideration -->
  <circle cx="440" cy="315" r="48" fill="#111" stroke="#c8a96e" stroke-width="1.5" opacity="0.55"/>
  <text x="440" y="296" font-family="sans-serif" font-size="9" fill="#c8a96e" text-anchor="middle" letter-spacing="2" opacity="0.75">STAGE 2</text>
  <text x="440" y="314" font-family="sans-serif" font-size="10" font-weight="bold" fill="#c8a96e" text-anchor="middle" opacity="0.8">CONSIDER-</text>
  <text x="440" y="329" font-family="sans-serif" font-size="10" font-weight="bold" fill="#c8a96e" text-anchor="middle" opacity="0.8">ATION</text>
  <text x="440" y="346" font-family="sans-serif" font-size="9" fill="#6b6b6b" text-anchor="middle">Myth Busting</text>
  <text x="440" y="385" font-family="sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" opacity="0.6">למה דווקא אנחנו?</text>

  <!-- Arrow 2→3 -->
  <path d="M492 315 L568 315" stroke="#c8a96e" stroke-width="1" stroke-dasharray="5,4" opacity="0.3"/>
  <polygon points="568,309 584,315 568,321" fill="#c8a96e" opacity="0.3"/>

  <!-- Stage 3: Purchase/Use — highlighted -->
  <circle cx="660" cy="315" r="62" fill="#101024" stroke="#5a8edc" stroke-width="2.5" opacity="0.9"/>
  <circle cx="660" cy="315" r="55" fill="none" stroke="#5a8edc" stroke-width="0.5" opacity="0.3"/>
  <text x="660" y="292" font-family="sans-serif" font-size="9" fill="#5a8edc" text-anchor="middle" letter-spacing="2" opacity="0.9">STAGE 3</text>
  <text x="660" y="312" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7ab0f0" text-anchor="middle">PURCHASE</text>
  <text x="660" y="328" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7ab0f0" text-anchor="middle">+ USE</text>
  <text x="660" y="347" font-family="sans-serif" font-size="9" fill="#5a8edc" text-anchor="middle" opacity="0.9">Instructional</text>
  <text x="660" y="400" font-family="sans-serif" font-size="11" fill="#7ab0f0" text-anchor="middle" opacity="0.8">האם אצליח להשתמש?</text>
  <!-- Glow effect -->
  <circle cx="660" cy="315" r="68" fill="none" stroke="#5a8edc" stroke-width="1" opacity="0.12"/>
  <circle cx="660" cy="315" r="80" fill="none" stroke="#5a8edc" stroke-width="0.5" opacity="0.07"/>

  <!-- 3D wave visualization (right side) -->
  <!-- Body outline simplified -->
  <ellipse cx="960" cy="290" rx="30" ry="50" fill="none" stroke="#2a3a5e" stroke-width="1.5" opacity="0.6"/>
  <!-- Radio wave rings emanating from device point -->
  <ellipse cx="960" cy="315" rx="15" ry="8" fill="none" stroke="#5a8edc" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="960" cy="315" rx="28" ry="15" fill="none" stroke="#5a8edc" stroke-width="1" opacity="0.5"/>
  <ellipse cx="960" cy="315" rx="42" ry="22" fill="none" stroke="#5a8edc" stroke-width="0.8" opacity="0.3"/>
  <ellipse cx="960" cy="315" rx="56" ry="29" fill="none" stroke="#5a8edc" stroke-width="0.5" opacity="0.18"/>
  <!-- Device point -->
  <circle cx="960" cy="315" r="4" fill="#5a8edc" opacity="0.9"/>
  <!-- Top-down crosshair hint -->
  <line x1="940" y1="295" x2="980" y2="295" stroke="#5a8edc" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="960" y1="275" x2="960" y2="315" stroke="#5a8edc" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.4"/>
  <text x="960" y="380" font-family="sans-serif" font-size="9" fill="#5a8edc" text-anchor="middle" opacity="0.7" letter-spacing="1">3D MEDICAL VIZ</text>

  <!-- "Nobody prepares this" tag -->
  <rect x="590" y="185" width="140" height="28" rx="14" fill="#5a8edc" opacity="0.15"/>
  <text x="660" y="204" font-family="sans-serif" font-size="10" fill="#7ab0f0" text-anchor="middle" opacity="0.9">← כולם מדלגים כאן</text>

  <!-- Labels -->
  <text x="600" y="555" font-family="sans-serif" font-size="15" fill="#c8a96e" text-anchor="middle" opacity="0.7" letter-spacing="4">INSTRUCTIONAL VIDEO · CUSTOMER JOURNEY</text>
  <text x="600" y="590" font-family="sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle" letter-spacing="2">THE VIDEO SHOP</text>
</svg>
