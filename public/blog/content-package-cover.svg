<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#2d7a3a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="80%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- 2 filming days input -->
  <rect x="60" y="200" width="220" height="230" rx="10" fill="#0f1a11" stroke="#2d7a3a" stroke-width="1.5" opacity="0.8"/>
