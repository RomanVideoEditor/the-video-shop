  <text x="170" y="310" font-family="sans-serif" font-size="72" font-weight="900" fill="#2d7a3a" text-anchor="middle" opacity="0.7">2</text>
  <text x="170" y="400" font-family="sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle">ראיונות + שטח ורחפן</text>

  <!-- Arrow -->
  <path d="M295 315 L420 315" stroke="#c8a96e" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
  <polygon points="420,307 440,315 420,323" fill="#c8a96e" opacity="0.5"/>

  <!-- Output cards -->
