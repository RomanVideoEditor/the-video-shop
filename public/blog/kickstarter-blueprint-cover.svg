<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#05ce78" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Progress bar (funding bar) -->
  <rect x="100" y="340" width="1000" height="12" rx="6" fill="#1e1e1e"/>
  <rect x="100" y="340" width="940" height="12" rx="6" fill="#05ce78" opacity="0.8"/>
  <text x="100" y="375" font-family="sans-serif" font-size="13" fill="#05ce78" opacity="0.7">$1,191,083 raised</text>
  <text x="1100" y="375" font-family="sans-serif" font-size="13" fill="#6b6b6b" text-anchor="end">Goal: $50,000</text>

  <!-- Big number -->
  <text x="600" y="210" font-family="sans-serif" font-size="96" font-weight="900" fill="#f5f5f0" text-anchor="middle" opacity="0.08">2,282%</text>

  <!-- Milestone markers -->
  <line x1="600" y1="280" x2="600" y2="340" stroke="#c8a96e" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
  <circle cx="600" cy="275" r="5" fill="#c8a96e" opacity="0.6"/>
  <text x="600" y="265" font-family="sans-serif" font-size="11" fill="#c8a96e" text-anchor="middle" opacity="0.7">Goal reached: Day 2</text>

  <!-- Backer count -->
  <text x="600" y="430" font-family="sans-serif" font-size="18" fill="#f5f5f0" text-anchor="middle" opacity="0.5">3,748 backers</text>

  <!-- Labels -->
  <text x="600" y="530" font-family="sans-serif" font-size="16" fill="#c8a96e" text-anchor="middle" opacity="0.7" letter-spacing="4">KICKSTARTER BLUEPRINT</text>
  <text x="600" y="565" font-family="sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle" letter-spacing="2">THE VIDEO SHOP</text>
</svg>
