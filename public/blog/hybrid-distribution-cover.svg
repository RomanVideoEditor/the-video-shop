<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <defs>
    <radialGradient id="g1" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3a1a6e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="80%" cy="70%" r="40%">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Source: one production box -->
  <rect x="60" y="220" width="200" height="190" rx="10" fill="#111" stroke="#c8a96e" stroke-width="2" opacity="0.9"/>
  <text x="160" y="255" font-family="sans-serif" font-size="10" fill="#c8a96e" text-anchor="middle" letter-spacing="2" opacity="0.8">PRODUCTION</text>
  <!-- Film camera icon simplified -->
  <rect x="108" y="270" width="70" height="50" rx="4" fill="#1a1a1a" stroke="#c8a96e" stroke-width="1.5" opacity="0.7"/>
  <circle cx="143" cy="295" r="14" fill="none" stroke="#c8a96e" stroke-width="1.5" opacity="0.6"/>
  <circle cx="143" cy="295" r="5" fill="#c8a96e" opacity="0.5"/>
  <rect x="178" y="278" width="12" height="10" rx="2" fill="#c8a96e" opacity="0.5"/>
  <rect x="178" y="297" width="12" height="10" rx="2" fill="#c8a96e" opacity="0.5"/>
  <text x="160" y="345" font-family="sans-serif" font-size="10" fill="#c8a96e" text-anchor="middle" opacity="0.7">יום צילום אחד</text>
  <text x="160" y="363" font-family="sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle">One Filming Day</text>
  <text x="160" y="392" font-family="sans-serif" font-size="26" font-weight="900" fill="#c8a96e" text-anchor="middle" opacity="0.5">×1</text>

  <!-- Central splitter / plus sign -->
  <text x="310" y="330" font-family="sans-serif" font-size="48" font-weight="900" fill="#c8a96e" text-anchor="middle" opacity="0.35">+</text>

  <!-- Four output channels -->
  <!-- Channel 1: External Recruitment -->
  <rect x="360" y="100" width="200" height="95" rx="8" fill="#111" stroke="#c8a96e" stroke-width="1.5" opacity="0.85"/>
  <text x="460" y="130" font-family="sans-serif" font-size="9" fill="#c8a96e" text-anchor="middle" letter-spacing="2" opacity="0.8">01 — EXTERNAL RECRUITMENT</text>
  <text x="460" y="153" font-family="sans-serif" font-size="11" fill="#f5f5f0" text-anchor="middle" opacity="0.65">Long + Short + LinkedIn Ads</text>
  <text x="460" y="178" font-family="sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle">מועמד פסיבי → אקטיבי</text>

  <!-- Channel 2: Internal Mobility -->
  <rect x="360" y="215" width="200" height="95" rx="8" fill="#111" stroke="#7a5a9e" stroke-width="1" opacity="0.75"/>
  <text x="460" y="245" font-family="sans-serif" font-size="9" fill="#a88ec8" text-anchor="middle" letter-spacing="2" opacity="0.8">02 — INTERNAL MOBILITY</text>
  <text x="460" y="268" font-family="sans-serif" font-size="11" fill="#f5f5f0" text-anchor="middle" opacity="0.55">Intranet · Teams · All-Hands</text>
  <text x="460" y="293" font-family="sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle">ניידות פנימית + שייכות</text>

  <!-- Channel 3: Brand Awareness -->
  <rect x="360" y="330" width="200" height="95" rx="8" fill="#111" stroke="#4a6e9e" stroke-width="1" opacity="0.70"/>
  <text x="460" y="360" font-family="sans-serif" font-size="9" fill="#6eaac8" text-anchor="middle" letter-spacing="2" opacity="0.8">03 — BRAND AWARENESS</text>
  <text x="460" y="383" font-family="sans-serif" font-size="11" fill="#f5f5f0" text-anchor="middle" opacity="0.55">Reels · TikTok · Stories</text>
  <text x="460" y="408" font-family="sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle">שנים לפני שמחפשים עבודה</text>

  <!-- Channel 4: B2B Identity -->
  <rect x="360" y="445" width="200" height="95" rx="8" fill="#111" stroke="#1e1e1e" stroke-width="1" opacity="0.65"/>
  <text x="460" y="475" font-family="sans-serif" font-size="9" fill="#888" text-anchor="middle" letter-spacing="2">04 — B2B IDENTITY</text>
  <text x="460" y="498" font-family="sans-serif" font-size="11" fill="#f5f5f0" text-anchor="middle" opacity="0.45">About Us · Events · Partners</text>
  <text x="460" y="523" font-family="sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle">לא חברה — תרבות</text>

  <!-- Connector lines from left box to channels -->
  <line x1="260" y1="315" x2="355" y2="147" stroke="#c8a96e" stroke-width="1" stroke-dasharray="5,4" opacity="0.3"/>
  <line x1="260" y1="315" x2="355" y2="262" stroke="#a88ec8" stroke-width="1" stroke-dasharray="5,4" opacity="0.25"/>
  <line x1="260" y1="315" x2="355" y2="377" stroke="#6eaac8" stroke-width="1" stroke-dasharray="5,4" opacity="0.2"/>
  <line x1="260" y1="315" x2="355" y2="492" stroke="#888" stroke-width="1" stroke-dasharray="5,4" opacity="0.15"/>

  <!-- Right side: result -->
  <rect x="610" y="220" width="200" height="190" rx="10" fill="#111" stroke="#c8a96e" stroke-width="1.5" opacity="0.7"/>
  <text x="710" y="255" font-family="sans-serif" font-size="10" fill="#c8a96e" text-anchor="middle" letter-spacing="2" opacity="0.8">DISTRIBUTION</text>
  <text x="710" y="310" font-family="sans-serif" font-size="68" font-weight="900" fill="#c8a96e" text-anchor="middle" opacity="0.65">4×</text>
  <text x="710" y="360" font-family="sans-serif" font-size="11" fill="#f5f5f0" text-anchor="middle" opacity="0.5">ערוצי הפצה</text>
  <text x="710" y="392" font-family="sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle">מהפקה אחת</text>

  <!-- Connector lines channels to result -->
  <line x1="565" y1="147" x2="605" y2="290" stroke="#c8a96e" stroke-width="1" stroke-dasharray="5,4" opacity="0.25"/>
  <line x1="565" y1="262" x2="605" y2="300" stroke="#a88ec8" stroke-width="1" stroke-dasharray="5,4" opacity="0.2"/>
  <line x1="565" y1="377" x2="605" y2="330" stroke="#6eaac8" stroke-width="1" stroke-dasharray="5,4" opacity="0.18"/>
  <line x1="565" y1="492" x2="605" y2="370" stroke="#888" stroke-width="1" stroke-dasharray="5,4" opacity="0.12"/>

  <!-- Ashtrom brand + symbol accent -->
  <text x="900" y="340" font-family="sans-serif" font-size="160" font-weight="900" fill="#c8a96e" opacity="0.05">+</text>

  <!-- Labels -->
  <text x="600" y="565" font-family="sans-serif" font-size="15" fill="#c8a96e" text-anchor="middle" opacity="0.7" letter-spacing="4">HYBRID DISTRIBUTION · EMPLOYER BRANDING</text>
  <text x="600" y="598" font-family="sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle" letter-spacing="2">THE VIDEO SHOP</text>
</svg>
