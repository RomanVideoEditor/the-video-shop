  <line x1="800" y1="200" x2="850" y2="290" stroke="#4a9eff" stroke-width="1" opacity="0.15"/>

  <!-- UI mock: code error -->
  <rect x="100" y="160" width="320" height="180" rx="8" fill="#111" stroke="#1e1e1e" stroke-width="1"/>
  <rect x="100" y="160" width="320" height="32" rx="8" fill="#1a1a1a"/>
  <circle cx="124" cy="176" r="5" fill="#ff5f57" opacity="0.8"/>
  <circle cx="142" cy="176" r="5" fill="#ffbd2e" opacity="0.8"/>
