<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <defs>
    <radialGradient id="g1" cx="40%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.11"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g1)"/>

  <!-- Speech bubble shapes (interview format) -->
  <rect x="100" y="180" width="300" height="80" rx="12" fill="#111" stroke="#1e1e1e" stroke-width="1"/>
  <polygon points="140,260 160,260 150,280" fill="#111" stroke="#1e1e1e" stroke-width="1"/>
  <text x="250" y="227" font-family="sans-serif" font-size="13" fill="#c8a96e" text-anchor="middle" opacity="0.8">סליחה על השאלה...</text>
  <text x="250" y="248" font-family="sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">מה הדבר הכי קשה בעבודה?</text>

  <rect x="130" y="310" width="300" height="80" rx="12" fill="#1a1a1a" stroke="#c8a96e" stroke-width="1" opacity="0.6"/>
  <polygon points="390,310 410,310 400,290" fill="#1a1a1a"/>
  <text x="280" y="357" font-family="sans-serif" font-size="13" fill="#f5f5f0" text-anchor="middle" opacity="0.8">לקום בבוקר...</text>
  <text x="280" y="378" font-family="sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">*צוחק* ...ולדעת שחיכו לי</text>

  <!-- Microphone icon (abstract) -->
  <rect x="750" y="200" width="30" height="60" rx="15" fill="none" stroke="#c8a96e" stroke-width="2" opacity="0.5"/>
  <path d="M730 255 Q730 290 765 290 Q800 290 800 255" fill="none" stroke="#c8a96e" stroke-width="2" opacity="0.4"/>
  <line x1="765" y1="290" x2="765" y2="320" stroke="#c8a96e" stroke-width="2" opacity="0.4"/>

  <!-- People silhouettes (row of employees) -->
  <circle cx="860" cy="350" r="18" fill="#1e1e1e"/>
  <rect x="845" y="372" width="30" height="40" rx="5" fill="#1e1e1e"/>
  <circle cx="920" cy="345" r="22" fill="#2a2a2a"/>
  <rect x="902" y="370" width="36" height="45" rx="5" fill="#2a2a2a"/>
  <circle cx="985" cy="350" r="18" fill="#1e1e1e"/>
  <rect x="970" y="372" width="30" height="40" rx="5" fill="#1e1e1e"/>
  <circle cx="1045" cy="348" r="20" fill="#2a2a2a"/>
  <rect x="1028" y="371" width="34" height="42" rx="5" fill="#2a2a2a"/>

  <!-- 15 min badge -->
  <circle cx="1100" cy="180" r="50" fill="none" stroke="#c8a96e" stroke-width="1.5" opacity="0.5"/>
  <text x="1100" y="173" font-family="sans-serif" font-size="22" font-weight="900" fill="#c8a96e" text-anchor="middle" opacity="0.7">15</text>
  <text x="1100" y="193" font-family="sans-serif" font-size="11" fill="#6b6b6b" text-anchor="middle">דקות</text>

  <!-- Labels -->
  <text x="600" y="530" font-family="sans-serif" font-size="16" fill="#c8a96e" text-anchor="middle" opacity="0.7" letter-spacing="4">FORMAT-DRIVEN CONTENT</text>
  <text x="600" y="565" font-family="sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle" letter-spacing="2">THE VIDEO SHOP</text>
</svg>
