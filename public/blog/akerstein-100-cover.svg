<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <defs>
    <radialGradient id="g1" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#c8a96e" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <!-- Film grain texture via turbulence not supported well, using pattern instead -->
  </defs>
  <rect width="1200" height="630" fill="url(#g1)"/>

  <!-- Film strip left (archive era) -->
  <rect x="60" y="80" width="160" height="460" rx="4" fill="#0d0d0d" stroke="#1e1e1e" stroke-width="1"/>
  <!-- Film sprocket holes -->
  <rect x="72" y="100" width="16" height="24" rx="3" fill="#1a1a1a"/>
  <rect x="72" y="140" width="16" height="24" rx="3" fill="#1a1a1a"/>
  <rect x="72" y="180" width="16" height="24" rx="3" fill="#1a1a1a"/>
  <rect x="72" y="220" width="16" height="24" rx="3" fill="#1a1a1a"/>
  <rect x="72" y="260" width="16" height="24" rx="3" fill="#1a1a1a"/>
  <rect x="72" y="300" width="16" height="24" rx="3" fill="#1a1a1a"/>
  <rect x="72" y="340" width="16" height="24" rx="3" fill="#1a1a1a"/>
  <rect x="72" y="380" width="16" height="24" rx="3" fill="#1a1a1a"/>
  <rect x="72" y="420" width="16" height="24" rx="3" fill="#1a1a1a"/>
  <rect x="72" y="460" width="16" height="24" rx="3" fill="#1a1a1a"/>
  <!-- Archive frames -->
  <rect x="94" y="110" width="116" height="80" rx="2" fill="#1e1814" opacity="0.8"/>
  <rect x="94" y="204" width="116" height="80" rx="2" fill="#1a1510" opacity="0.8"/>
  <rect x="94" y="298" width="116" height="80" rx="2" fill="#1e1814" opacity="0.8"/>
  <rect x="94" y="392" width="116" height="80" rx="2" fill="#1a1510" opacity="0.8"/>
  <!-- Grain overlay simulation -->
  <rect x="94" y="110" width="116" height="80" rx="2" fill="url(#grain)" opacity="0.3"/>
  <!-- Year labels on archive frames -->
  <text x="152" y="158" font-family="monospace" font-size="11" fill="#c8a96e" text-anchor="middle" opacity="0.5">1924</text>
  <text x="152" y="252" font-family="monospace" font-size="11" fill="#c8a96e" text-anchor="middle" opacity="0.5">1967</text>
  <text x="152" y="346" font-family="monospace" font-size="11" fill="#c8a96e" text-anchor="middle" opacity="0.5">1989</text>
  <text x="152" y="440" font-family="monospace" font-size="11" fill="#c8a96e" text-anchor="middle" opacity="0.5">2010</text>

  <!-- Transition arrow -->
  <path d="M240 315 L480 315" stroke="#c8a96e" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.4"/>
  <polygon points="480,308 496,315 480,322" fill="#c8a96e" opacity="0.4"/>

  <!-- Modern 4K frame right -->
  <rect x="510" y="160" width="580" height="310" rx="8" fill="#111" stroke="#c8a96e" stroke-width="1" opacity="0.6"/>
  <!-- Drone perspective lines -->
  <line x1="800" y1="160" x2="600" y2="380" stroke="#c8a96e" stroke-width="0.5" opacity="0.15"/>
  <line x1="800" y1="160" x2="1000" y2="380" stroke="#c8a96e" stroke-width="0.5" opacity="0.15"/>
  <line x1="800" y1="160" x2="800" y2="470" stroke="#c8a96e" stroke-width="0.5" opacity="0.1"/>
  <!-- Geometric concrete texture (Akerstein = concrete) -->
  <rect x="540" y="200" width="80" height="80" rx="2" fill="#1a1a1a"/>
  <rect x="630" y="200" width="80" height="80" rx="2" fill="#222"/>
  <rect x="720" y="200" width="80" height="80" rx="2" fill="#1a1a1a"/>
  <rect x="810" y="200" width="80" height="80" rx="2" fill="#222"/>
  <rect x="900" y="200" width="80" height="80" rx="2" fill="#1a1a1a"/>
  <rect x="540" y="290" width="80" height="80" rx="2" fill="#222"/>
  <rect x="630" y="290" width="80" height="80" rx="2" fill="#1a1a1a"/>
  <rect x="720" y="290" width="80" height="80" rx="2" fill="#222"/>
  <rect x="810" y="290" width="80" height="80" rx="2" fill="#1a1a1a"/>
  <rect x="900" y="290" width="80" height="80" rx="2" fill="#222"/>
  <!-- 4K label -->
  <text x="1068" y="180" font-family="monospace" font-size="10" fill="#c8a96e" text-anchor="end" opacity="0.5">4K</text>

  <!-- 100 years badge -->
  <circle cx="800" cy="315" r="55" fill="#0a0a0a" stroke="#c8a96e" stroke-width="1.5" opacity="0.7"/>
  <text x="800" y="307" font-family="sans-serif" font-size="28" font-weight="900" fill="#c8a96e" text-anchor="middle" opacity="0.9">100</text>
  <text x="800" y="330" font-family="sans-serif" font-size="10" fill="#6b6b6b" text-anchor="middle" letter-spacing="2">שנה</text>

  <!-- Labels -->
  <text x="600" y="545" font-family="sans-serif" font-size="16" fill="#c8a96e" text-anchor="middle" opacity="0.7" letter-spacing="4">ARCHIVE + 4K · CORPORATE REBRAND</text>
  <text x="600" y="580" font-family="sans-serif" font-size="12" fill="#6b6b6b" text-anchor="middle" letter-spacing="2">THE VIDEO SHOP</text>
</svg>
